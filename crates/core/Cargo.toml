[package]
name = "siphon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Siphon download engine: dynamic segmentation, crash-proof resume, link refresh."

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
bytes = "1.12.2"
cbc = { version = "0.2.1", features = ["block-padding"] }
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = "0.3.34"
httpdate = "1.0.3"
jiff = "1.0.3"
keyring = "4.2.0"
m3u8-rs = "6.0.1"
md-5 = "0.11.0"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
plist = "1.10.4"
# HTTP/1.1 only on purpose: a segmented download wants one TCP flow per
# worker. HTTP/2 would multiplex every range over a single congestion window.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks", "system-proxy"] }
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
sspi = { version = "0.23.1", features = ["network_client", "dns_resolver"] }
suppaftp = { version = "13.0.0", default-features = false, features = ["tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
trash = "5.4.0"
url = "2.5.9"
xattr = "1.7.0"

[dev-dependencies]
siphon-testserver = { path = "../testserver" }
tokio = { version = "1.54.1", features = ["test-util"] }
