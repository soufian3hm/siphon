[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/host", "crates/testserver"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.100"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
